<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Smart Shelf</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&family=Anek+Latin:wdth,wght@75..125,100..800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
:root {
  --wall:      #E9EFE6;
  --paper:     #FCFDFB;
  --ink:       #14251B;
  --ink-soft:  #5A6B5F;
  --hairline:  #CFD9CB;

  --turmeric:  #F2E3BC;
  --turmeric-ink: #4A3908;
  --chilli:    #B9271A;

  --produce:   var(--ink);

  --step: 1.25rem;
  --font: "Anek Latin", "Anek Devanagari", "Segoe UI", system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font);
  font-variation-settings: "wdth" 100, "wght" 400;
  font-size: 1.0625rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
  border-radius: 2px;
}

.shell {
  max-width: 34rem;
  margin: 0 auto;
  padding: clamp(1rem, 4vw, 2rem) clamp(1rem, 4vw, 1.5rem) 3rem;
}

/* ---------- masthead ---------- */

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 0.875rem;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: var(--step);
}

.masthead__name {
  margin: 0;
  font-size: 1.0625rem;
  font-variation-settings: "wdth" 88, "wght" 700;
  letter-spacing: 0.005em;
}

.masthead__controls {
  display: flex;
  align-items: baseline;
  gap: 1.125rem;
}

.lang {
  font-family: var(--font);
  font-size: 0.875rem;
  font-variation-settings: "wght" 600;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  border-bottom: 1.5px solid transparent;
  padding: 0.15rem 0.1rem;
  cursor: pointer;
}

.lang:hover { color: var(--ink); border-bottom-color: var(--hairline); }

.picker {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
  font-size: 0.9375rem;
  color: var(--ink-soft);
}

.picker__select {
  font-family: var(--font);
  font-size: 0.9375rem;
  font-variation-settings: "wght" 600;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1.5px solid var(--ink);
  padding: 0.15rem 0.1rem;
  cursor: pointer;
}

/* ---------- the crate: hero ---------- */

.crate {
  position: relative;
  background: var(--paper);
  border-radius: 14px;
  border-left: 7px solid var(--produce);
  padding: 1.5rem 1.375rem 1.5rem 1.5rem;
  transition: background-color 420ms ease, color 420ms ease;
}

.crate__who {
  margin: 0 0 1.125rem;
  font-size: 0.9375rem;
  font-variation-settings: "wght" 600;
  color: var(--ink-soft);
}

.crate__say {
  margin: 0;
  font-size: clamp(2rem, 7.2vw, 3.125rem);
  font-variation-settings: "wdth" 84, "wght" 700;
  line-height: 1.04;
  letter-spacing: -0.021em;
  text-wrap: balance;
}

.crate__when {
  margin: 1rem 0 0;
  font-size: 1.1875rem;
  font-variation-settings: "wght" 500;
  line-height: 1.35;
  max-width: 24ch;
}

.crate__facts {
  margin: 0.875rem 0 0;
  font-size: 0.9375rem;
  color: var(--ink-soft);
  max-width: 40ch;
}

.crate__facts:empty { display: none; }

/* state grounds — the whole card carries status */

.crate[data-state="watch"] {
  background: var(--turmeric);
  color: var(--turmeric-ink);
  box-shadow: 0 2px 14px rgba(120, 92, 10, 0.15);
}
.crate[data-state="watch"] .crate__who,
.crate[data-state="watch"] .crate__facts { color: #6B5518; }

.crate[data-state="act"] {
  background: var(--chilli);
  color: var(--paper);
  border-left-color: rgba(252, 253, 251, 0.5);
  box-shadow: 0 3px 20px rgba(185, 39, 26, 0.3);
}
.crate[data-state="act"] .crate__who,
.crate[data-state="act"] .crate__facts { color: rgba(252, 253, 251, 0.92); }

.crate[data-state="idle"] {
  background: transparent;
  border: 1px dashed var(--hairline);
  border-left: 7px solid var(--hairline);
}
.crate[data-state="idle"] .crate__say {
  font-variation-settings: "wdth" 90, "wght" 500;
  font-size: clamp(1.375rem, 4.6vw, 1.75rem);
  color: var(--ink-soft);
}

/* ---------- acknowledge ---------- */

.ack {
  margin-top: 1.375rem;
  font-family: var(--font);
  font-size: 1rem;
  font-variation-settings: "wght" 600;
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  padding: 0.625rem 1.125rem;
  cursor: pointer;
}

.crate[data-state="act"] .ack {
  color: var(--chilli);
  background: var(--paper);
  border-color: var(--paper);
}

.ack[hidden] { display: none; }

/* ---------- other shelves: rows, not cards ---------- */

.others { margin-top: 2rem; }
.others[hidden] { display: none; }

.others__title {
  margin: 0 0 0.5rem;
  font-size: 0.9375rem;
  font-variation-settings: "wght" 600;
  color: var(--ink-soft);
}

.rows { margin: 0; padding: 0; list-style: none; }

.row {
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.8125rem 0.25rem 0.8125rem 1rem;
  border: 0;
  border-top: 1px solid var(--hairline);
  width: 100%;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.9rem;
  bottom: 0.9rem;
  width: 4px;
  border-radius: 2px;
  background: var(--produce);
}

.row__who { font-variation-settings: "wght" 600; }

.row__how {
  font-size: 0.9375rem;
  color: var(--ink-soft);
  text-align: right;
}

.row[data-state="act"] .row__how { color: var(--chilli); font-variation-settings: "wght" 600; }
.row[data-state="watch"] .row__how { color: #8A6A10; font-variation-settings: "wght" 600; }

/* ---------- evidence disclosure ---------- */

.evidence {
  margin-top: 2rem;
  border-top: 1px solid var(--hairline);
  padding-top: 0.875rem;
}

.evidence__summary {
  font-size: 0.9375rem;
  font-variation-settings: "wght" 600;
  color: var(--ink-soft);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.evidence__summary::-webkit-details-marker { display: none; }

.evidence__summary::after {
  content: "";
  width: 0.5rem; height: 0.5rem;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg) translate(-2px, -2px);
}

.evidence[open] .evidence__summary::after {
  transform: rotate(-135deg) translate(-2px, -2px);
}

.evidence__body { padding-top: 1.125rem; }

.numbers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
  gap: 0.875rem 1.25rem;
  margin: 0 0 1.375rem;
}

.numbers div { margin: 0; }

.numbers dt {
  font-size: 0.8125rem;
  color: var(--ink-soft);
  margin-bottom: 0.1rem;
}

.numbers dd {
  margin: 0;
  font-size: 1.25rem;
  font-variation-settings: "wdth" 92, "wght" 600;
  font-variant-numeric: tabular-nums;
}

.plot { position: relative; height: 240px; }

.evidence__note {
  margin: 1rem 0 0;
  font-size: 0.875rem;
  color: var(--ink-soft);
  max-width: 52ch;
}

/* ---------- foot ---------- */

.foot {
  margin-top: 2rem;
  font-size: 0.8125rem;
  color: var(--ink-soft);
}

:root:lang(hi) body,
body:lang(hi) { line-height: 1.62; }

:lang(hi) .crate__say {
  line-height: 1.26;
  letter-spacing: 0;
}

:lang(hi) .crate__when { line-height: 1.5; }

:lang(hi) .numbers dd { font-variation-settings: "wdth" 96, "wght" 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}
</style>
</head>

<body>
<div class="shell">

  <header class="masthead">
    <h1 class="masthead__name" id="brand">Smart Shelf</h1>
    <div class="masthead__controls">
      <button class="lang" id="lang-toggle" type="button">English</button>
      <label class="picker">
        <span id="shelf-label">शेल्फ</span>
        <select class="picker__select" id="shelf-picker"></select>
      </label>
    </div>
  </header>

  <main>
    <section class="crate" id="crate" data-state="idle" aria-live="polite">
      <p class="crate__who" id="crate-who">Reading the shelf</p>
      <h2 class="crate__say" id="crate-say">Just a moment.</h2>
      <p class="crate__when" id="crate-when"></p>
      <p class="crate__facts" id="crate-facts"></p>
      <button class="ack" id="ack" type="button" hidden>I've moved them</button>
    </section>

    <section class="others" id="others" hidden>
      <h2 class="others__title">Other shelves</h2>
      <ul class="rows" id="rows"></ul>
    </section>

    <details class="evidence" id="evidence">
      <summary class="evidence__summary">Show the readings</summary>
      <div class="evidence__body">
        <dl class="numbers" id="numbers"></dl>
        <div class="plot"><canvas id="sri-chart"></canvas></div>
        <p class="evidence__note" id="evidence-note"></p>
      </div>
    </details>
  </main>

  <footer class="foot"><span id="foot-time"></span></footer>

</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
